<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary identity -->
    <title>Jinja Edu-Hub — Courses, Learning &amp; Jobs in Jinja</title>
    <meta
      name="description"
      content="Jinja Edu-Hub connects learners in Jinja with practical courses, a guided online Learning Space, and local job opportunities. Learn a skill, grow your career, and find work — all in one place."
    />
    <meta
      name="keywords"
      content="Jinja, education, e-learning, courses, skills training, jobs, employment, learning platform, Uganda, career growth"
    />
    <meta name="author" content="Jinja Edu-Hub Team" />
    <meta name="application-name" content="Jinja Edu-Hub" />

    <!-- Browser / OS appearance -->
    <meta name="theme-color" content="#F76707" />
    <meta name="color-scheme" content="light" />

    <!-- Icons: branded sprout logo (SVG vector) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Apple touch icons require PNG; generate favicon.png/apple-touch-icon.png with:
         npx --yes svgexport public/favicon.svg public/apple-touch-icon.png 180:180 -->
    <link rel="logo" type="image/svg+xml" href="/logo.svg" />

    <!-- Brand font: Inter (matches tailwind.config.js fontFamily.sans) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Open Graph (link/unfurl previews: WhatsApp, Telegram, Slack, Facebook) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Jinja Edu-Hub" />
    <meta property="og:title" content="Jinja Edu-Hub — Courses, Learning &amp; Jobs in Jinja" />
    <meta
      property="og:description"
      content="Practical courses, a guided Learning Space, and local job listings — everything a learner in Jinja needs to grow from skill to work."
    />
    <!-- Tip: Facebook/WhatsApp don't render SVG og:image. Export a 1200x630 PNG later:
         npx --yes svgexport public/logo.svg public/og-image.png 1200:630
         then add: <meta property="og:image" content="https://YOUR-DOMAIN/og-image.png" /> -->

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Jinja Edu-Hub — Courses, Learning &amp; Jobs in Jinja" />
    <meta
      name="twitter:description"
      content="Practical courses, a guided Learning Space, and local job listings — everything a learner in Jinja needs to grow from skill to work."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
