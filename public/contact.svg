<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Envelope with a message on its way">
  <rect width="1200" height="900" fill="#FFFFFF"/>
  <g stroke="#1A1A1A" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <!-- ground -->
    <path d="M150 790 H1050" stroke="#E8E8E8" stroke-width="5"/>
    <ellipse cx="520" cy="750" rx="320" ry="14" fill="#EFEFEF" stroke="none"/>
    <!-- letter peeking out -->
    <rect x="340" y="290" width="380" height="150" fill="#F0F0F0"/>
    <line x1="382" y1="330" x2="612" y2="330" stroke="#F76707" stroke-width="6"/>
    <line x1="382" y1="366" x2="568" y2="366" stroke="#BDBDBD" stroke-width="5"/>
    <!-- envelope -->
    <rect x="280" y="380" width="480" height="300" rx="20" fill="#FFFFFF"/>
    <path d="M288 402 L520 585 L752 402" fill="none" stroke-width="6"/>
    <!-- stamp -->
    <rect x="608" y="592" width="72" height="82" rx="8" fill="#F8E3C4"/>
    <path d="M644 646 a26 26 0 1 1 0.1 0" fill="none" stroke="#F76707" stroke-width="5"/>
    <!-- speech bubble -->
    <rect x="130" y="200" width="210" height="130" rx="30" fill="#E2A93B"/>
    <path d="M214 330 L200 372 L258 336" fill="#E2A93B"/>
    <circle cx="185" cy="264" r="7" fill="#1A1A1A" stroke="none"/>
    <circle cx="233" cy="264" r="7" fill="#1A1A1A" stroke="none"/>
    <circle cx="281" cy="264" r="7" fill="#1A1A1A" stroke="none"/>
    <!-- paper plane -->
    <path d="M900 220 L1044 174 L952 296 L902 272 Z" fill="#F0F0F0"/>
    <path d="M952 296 L902 272" stroke-width="5"/>
    <path d="M820 300 C798 322 782 348 772 376" fill="none" stroke="#BDBDBD" stroke-width="5" stroke-dasharray="2 26"/>
    <!-- sprigs -->
    <path d="M170 782 C162 736 166 706 178 678" fill="none"/>
    <path d="M174 690 Q148 674 150 648 Q174 660 174 690 Z" fill="#2F6B47"/>
    <path d="M182 714 Q206 700 212 676 Q188 686 182 714 Z" fill="#2F6B47"/>
    <path d="M1030 780 C1040 740 1036 712 1024 686" fill="none"/>
    <path d="M1028 698 Q1054 684 1056 658 Q1032 670 1028 698 Z" fill="#2F6B47"/>
    <!-- gold accents -->
    <circle cx="920" cy="480" r="6" fill="#E2A93B" stroke="none"/>
    <path d="M1100 300 L1100 332 M1084 316 L1116 316" stroke="#E2A93B" stroke-width="6"/>
  </g>
</svg>
