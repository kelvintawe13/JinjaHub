    <rect x="604" y="524" width="188" height="52" rx="16" fill="#FFFFFF"/>
    <line x1="622" y1="550" x2="746" y2="550" stroke="#BDBDBD" stroke-width="5"/>
    <rect x="588" y="610" width="200" height="26" rx="13" fill="#E5E5E5"/>
    <!-- calendar -->
    <rect x="150" y="560" width="260" height="230" rx="18" fill="#FFFFFF"/>
    <rect x="150" y="560" width="260" height="60" fill="#F79A5C"/>
    <line x1="196" y1="536" x2="196" y2="568" stroke-width="6"/>
    <line x1="366" y1="536" x2="366" y2="568" stroke-width="6"/>
    <circle cx="206" cy="672" r="13" fill="#F0F0F0"/>
    <circle cx="280" cy="672" r="13" fill="#F76707"/>
    <circle cx="354" cy="672" r="13" fill="#F0F0F0"/>
    <circle cx="206" cy="730" r="13" fill="#F0F0F0"/>
