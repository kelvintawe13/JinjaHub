    <path d="M1000 770 C1008 724 1004 694 992 666" fill="none"/>
    <path d="M996 678 Q970 662 972 636 Q996 648 996 678 Z" fill="#2F6B47"/>
    <path d="M1004 704 Q1028 690 1034 666 Q1010 676 1004 704 Z" fill="#2F6B47"/>
